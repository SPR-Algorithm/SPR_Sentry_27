terrain_analysis:
  ros__parameters:
    scanVoxelSize: 0.08                 # 略增：地面环更平滑，单帧尖峰略少
    decayTime: 0.5
    noDecayDis: 0.0
    clearingDis: 0.0
    useSorting: True
    quantileZ: 0.28                     # 抬高地面分位，抑制远处地面被当成障碍（圆弧噪点）
    considerDrop: False
    limitGroundLift: True               # 限制地面估计被异常低点拉低，减轻地面整块被当“台阶”
    maxGroundLift: 0.25
    clearDyObs: True
    minDyObsDis: 0.3
    minDyObsAngle: 0.0
    minDyObsRelZ: -0.3
    absDyObsRelZThre: 0.2
    minDyObsVFOV: -28.0
    maxDyObsVFOV: 33.0
    minDyObsPointNum: 1
    noDataObstacle: False
    noDataBlockSkipNum: 0
    minBlockPointNum: 35                # 提高：抑制稀疏地面环形成散点障碍
    vehicleHeight: 0.35                 # 略减：少输出弱 disZ 假障碍
    voxelPointUpdateThre: 100
    voxelTimeUpdateThre: 1.0
    minRelZ: -1.5
    maxRelZ: 0.25                       # 收紧竖直窗，减少远处地面点进入 terrain_map
    disRatioZ: 0.15                     # 减小随距离放宽的 Z 窗，抑制远距离地面弧

# terrain_map / terrain_map_ext 点云 frame_id 均为 odom；costmap 测距原点用 base_footprint（勿用 front_mid360，避免云台帧抖动）。
terrain_analysis_ext:
  ros__parameters:
    scanVoxelSize: 0.1
    decayTime: 0.2
    noDecayDis: 0.0
    clearingDis: 20.0
    useSorting: true
    quantileZ: 0.2
    vehicleHeight: 1.0
    voxelPointUpdateThre: 100
    voxelTimeUpdateThre: 2.0
    lowerBoundZ: -1.5
    upperBoundZ: 0.5
    disRatioZ: 0.2
    checkTerrainConn: False
    terrainUnderVehicle: -0.75
    terrainConnThre: 0.5
    ceilingFilteringThre: 2.0
    localTerrainMapRadius: 4.0

