planner_server:
  ros__parameters:
    use_sim_time: False
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_theta_star_planner/ThetaStarPlanner" # In Iron and older versions, "/" was used instead of "::"
      how_many_corners: 8
      w_euc_cost: 1.0
      w_traversal_cost: 10.0
      w_heuristic_cost: 1.0

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.02
    min_y_velocity_threshold: 0.02
    min_theta_velocity_threshold: 0.05
    failure_tolerance: 0.3 
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    current_goal_checker: "general_goal_checker"
    publish_zero_velocity: true
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5   
      movement_time_allowance: 8.0    

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 3.14

    FollowPath:    
      plugin: "nav2_mppi_controller::MPPIController"
      # --- 自定义/特殊控制逻辑参数 ---
      adjustThre: 14.0           # 触发航向调整的坡度/角度阈值 (猜测为定制版MPPI参数)
      minAngleDiff: 365.0        # 持续调整航向的误差阈值
      adjustHeadingSpeed: 0.2    # 调整航向时的自旋角速度

      # --- MPPI 核心预测与采样机制 ---
      time_steps: 32             # 预测视距 = 32*0.05 = 1.6s；@2.8m/s 约 4.5m，近距离障碍才有足够前瞻刹停
      model_dt: 0.05             # 预测步长，通常等于 1/controller_frequency
      batch_size: 2000           # 每次采样的轨迹数量。全向车自由度高，2000能保证较好的寻优质量，但吃CPU。
      vx_std: 0.50               # X方向速度采样噪声(标准差)。越大探索空间越广，但也更容易产生抖动。
      vy_std: 0.38               # 降低侧向采样范围：减少"弯道大vy切弦→脱路→回补"的冲动
      wz_std: 0.28               # 旋转速度采样噪声。全向车可适当调小以保持平稳。
      vx_max: 2.6                # 略降顶速，缩短 2.6m/s 下刹停距离（原 2.8 近距离易刹不住）
      vx_min: -2.6
      vy_max: 2.6
      wz_max: 1.0
      iteration_count: 1         # 优化迭代次数，官方建议保持1，靠增大batch_size来提升质量。
      prune_distance: 5.5        # 路径裁剪距离。由于极速高达3.5m/s，此值需稍大以防截断机器人视野内的高速参考点。
      transform_tolerance: 0.1   
      temperature: 0.20          # 再降温度：在狭窄/弯道场景更决断地选最优轨迹，而非平均化
      gamma: 0.030               # 控制连续性惩罚；略增可抑制"大vy → 大-vy"的震荡换向
      motion_model: "Omni"       # 全向轮运动学模型
      visualize: false           
      reset_period: 1.0          
      regenerate_noises: false
      retry_attempt_limit: 3     

      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3

      # --- 评价器 (Critics) 权重分配体系 ---
      critics: ["ObstaclesCritic", "GoalCritic", "PathAlignCritic", "PathFollowCritic", "TwirlingCritic"]
      
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0         # 目标点吸引力权重。
        threshold_to_consider: 2.0 # 提前进入“逼近目标”阶段，配合限速更平顺减速。

      PreferForwardCritic: 
        enabled: false           # 全向车通常不需要强制车头朝前，设为false合理。
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.5 

      ObstaclesCritic: 
        enabled: true
        cost_power: 1
        repulsion_weight: 1.5    # 增强中距离代价感知：狭窄空间高速轨迹扫过更多障碍，惩罚更重→自然减速
        critical_weight: 35.0    # margin 内强惩罚，促近距离急刹/绕行
        consider_footprint: true # 用 footprint 判碰，比点检更不易“贴边刹不住”
        collision_cost: 100000.0
        collision_margin_distance: 0.28 # 提前进入临界区（原 0.15 对 2.6m/s 过晚）
        near_goal_distance: 0.4
        inflation_radius: 0.4    # 与 local/global inflation_layer 一致
        cost_scaling_factor: 5.0 # 略增斜率，中近距离代价上升更快
        inflation_layer_name: ["inflation_layer"]

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.5         # 稍升：配合 use_path_orientations:true 更有效约束弯道切弦
        max_path_occupancy_ratio: 0.08
        trajectory_point_step: 3
        threshold_to_consider: 1.5
        offset_from_furthest: 4  # 原 8 过远；弯道参考点更近，防止绕过弯心的点引导切弦
        use_path_orientations: true  # 关键：弯道时同时约束轨迹方向，防止切弦大 vy

      PathFollowCritic: 
        enabled: true
        cost_power: 1
        cost_weight: 5.0         # 略降推进权，不让追路径点压过 ObstaclesCritic
        offset_from_furthest: 2  # 原 4；弯道时目标点更贴近弯道，避免直线穿越弯心
        threshold_to_consider: 1.5

      PathAngleCritic: 
        enabled: false           # 全向轮不需要像阿克曼那样过度关注相对路径角度，关闭合理。
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 1.5 
        max_angle_to_furthest: 1.0
        mode: 0

      TwirlingCritic:
        enabled: true
        twirling_cost_power: 1
        twirling_cost_weight: 4.0 # 防止全向车在行进中无意义地“原地陀螺转”。

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      update_frequency: 15.0     # 提高局部代价地图刷新，近距离障碍更早进图
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: gimbal_yaw_fake
      rolling_window: true
      # 需覆盖约 2 * vx_max * (time_steps * model_dt)，32*0.05*2.6*2 ≈ 8.3m
      width: 10
      height: 10
      resolution: 0.05
      robot_radius: 0.2
      plugins: ["static_layer", "intensity_voxel_layer", "inflation_layer"]
      intensity_voxel_layer:
        plugin: pb_nav2_costmap_2d::IntensityVoxelLayer
        enabled: true
        track_unknown_space: true
        footprint_clearing_enabled: true
        publish_voxel_map: false
        combination_method: 1
        mark_threshold: 0
        origin_z: 0.0
        unknown_threshold: 5
        z_resolution: 0.05
        z_voxels: 16
        min_obstacle_height: 0.0
        max_obstacle_height: 2.0
        min_obstacle_intensity: 0.1
        max_obstacle_intensity: 2.0
        observation_sources: terrain_map
        terrain_map:
          data_type: PointCloud2
          # '<robot_namespace>' keyword shall be replaced with 'namespace' where user defined.
          # It doesn't need to start with '/'
          topic: <robot_namespace>/terrain_map
          sensor_frame: front_mid360
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.2
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.4
        inflation_unknown_space: true
      always_send_full_costmap: False

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: gimbal_yaw_fake
      robot_radius: 0.2
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "intensity_voxel_layer", "inflation_layer"]
      intensity_voxel_layer:
        plugin: pb_nav2_costmap_2d::IntensityVoxelLayer
        enabled: true
        track_unknown_space: true
        footprint_clearing_enabled: true
        publish_voxel_map: false
        combination_method: 1
        mark_threshold: 0
        origin_z: 0.0
        unknown_threshold: 5
        z_resolution: 0.05
        z_voxels: 16
        min_obstacle_height: 0.0
        max_obstacle_height: 2.0
        min_obstacle_intensity: 0.1
        max_obstacle_intensity: 2.0
        observation_sources: terrain_map_ext
        terrain_map_ext:
          data_type: PointCloud2
          # '<robot_namespace>' keyword shall be replaced with 'namespace' where user defined.
          # It doesn't need to start with '/'
          topic: <robot_namespace>/terrain_map_ext
          sensor_frame: front_mid360
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.2
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.4
        inflation_unknown_space: true
      always_send_full_costmap: False

map_server:
  ros__parameters:
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: False
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "pb_nav2_behaviors/BackUpFreeSpace"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: gimbal_yaw_fake
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.75
    min_rotational_vel: 0.35
    rotational_acc_lim: 2.2
    # params for spr_nav2_behaviors/BackUpFreeSpace
    service_name: "global_costmap/get_costmap"
    max_radius: 2.0
    visualize: false

waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

# 与 MPPI 上限一致；线加速度按 0→3 m/s 约 1.4 s 估算 ≈2.14 m/s²
velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 30.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [2.6, 2.6, 1.2]
    min_velocity: [-2.6, -2.6, -1.2]
    max_accel: [2.8, 2.8, 2.0]
    max_decel: [-5.0, -5.0, -3.0]   # 加强执行层减速，配合 MPPI 近距离急刹
    odom_topic: "odometry"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]      # 与 MPPI 一致：到点后允许输出真实零速，避免死区把 0.05~0.1 抬成持续微动
    velocity_timeout: 0.2

